<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0b">
<title>Aironi Bianchi</title>
<style>
:root{color-scheme:dark;--bg:#0b0b0b;--cd:#171717;--tx:#fff;--mu:#a3a3a3;--ac:#dc2626;--ln:#2e2e2e;--ok:#4ade80;--wn:#fbbf24}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,sans-serif;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
#app{max-width:640px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top,0px)) 16px 16px}
h1{font-size:24px;margin:4px 0 14px;font-style:italic;font-weight:900;text-transform:uppercase;border-bottom:3px solid var(--ac);display:inline-block;padding-right:18px}
.hd{display:flex;align-items:center;gap:12px;margin-bottom:14px}.hd img{width:72px;height:72px}
.bn{font-size:24px;font-weight:900;font-style:italic;text-transform:uppercase;line-height:1.1}
.card{background:var(--cd);border:1px solid var(--ln);border-left:3px solid var(--ac);border-radius:12px;padding:14px;margin-bottom:12px}
.card>b{display:block;margin-bottom:4px}
.mu{color:var(--mu);font-size:14px}.ok{color:var(--ok)}.wn{color:var(--wn)}
.tag{display:inline-block;font-size:12px;padding:2px 9px;border-radius:99px;border:1px solid var(--ln);margin:4px 4px 0 0}
input,select,textarea{width:100%;padding:11px;margin:4px 0 8px;border:1px solid var(--ln);border-radius:9px;background:var(--bg);color:var(--tx);font:inherit}
label{display:block;font-size:13px;color:var(--mu)}
.ck{display:flex;align-items:center;gap:8px;color:var(--tx);font-size:15px;margin:6px 0 10px}.ck input{width:auto;margin:0}
.row{display:flex;gap:8px}.row>*{flex:1}
button{min-height:42px;padding:9px 16px;margin:4px 6px 0 0;border:0;border-radius:9px;background:var(--ac);color:#fff;font:inherit;font-weight:600;cursor:pointer}
button:active{transform:scale(.97)}
button.g{background:transparent;color:var(--tx);border:1px solid var(--ln);font-weight:400}
button.s{min-height:34px;padding:4px 11px}
a{color:#f87171}
.rw{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-top:1px solid var(--ln)}
.hero{background:linear-gradient(135deg,#7f1d1d,#1c0a0a 75%);border:1px solid var(--ac);border-radius:16px;padding:16px;margin-bottom:12px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.tile{background:var(--cd);border:1px solid var(--ln);border-radius:12px;padding:10px;text-align:center;cursor:pointer}.tile .n{font-size:22px;font-weight:800}
.seg{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto}
.seg button{margin:0;background:var(--cd);border:1px solid var(--ln);color:var(--mu);border-radius:99px;min-height:36px;padding:6px 14px;font-weight:400;white-space:nowrap}
.seg button.on{background:var(--ac);border-color:var(--ac);color:#fff}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--cd);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;margin:0;border-radius:0;background:transparent;color:var(--mu);font-size:12px;font-weight:400;padding:14px 2px}
nav button.on{color:var(--ac);font-weight:700}
.fab{position:fixed;right:16px;bottom:calc(78px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;font-size:30px;padding:0;margin:0;z-index:6;box-shadow:0 6px 20px #000a;display:none}
#bd{display:none;position:fixed;inset:0;background:#000b;z-index:20}
#sh{display:none;position:fixed;left:0;right:0;bottom:0;max-height:90vh;overflow:auto;z-index:30;background:var(--cd);border-top:3px solid var(--ac);border-radius:20px 20px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom,0px))}
body.open #bd,body.open #sh{display:block}
#sh h2{margin:0 0 10px;font-size:19px}
#ts{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translate(-50%,-140px);background:var(--ac);color:#fff;padding:10px 18px;border-radius:99px;z-index:40;transition:transform .3s}
#ts.on{transform:translate(-50%,0)}
.login{max-width:360px;margin:0 auto;text-align:center;padding-top:24px}.login img{width:170px;height:170px;display:block;margin:0 auto 10px}
.login input{text-align:left}
.err{color:#fca5a5;min-height:22px;font-size:14px}
ul.sl{list-style:none;padding:0;margin:6px 0}ul.sl li{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:6px 0;border-top:1px solid var(--ln)}
</style>
</head>
<body>
<div id="app"><p class="mu">Caricamento…</p></div>
<nav id="nav"></nav>
<button class="fab" id="fab" onclick="add()">+</button>
<div id="bd" onclick="closeSheet()"></div><div id="sh"></div>
<div id="ts"></div>

const $=s=>document.querySelector(s),v=i=>($("#"+i)?.value||"").trim();
const E=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const eur=n=>(+n||0).toLocaleString("it-IT",{style:"currency",currency:"EUR"});
const today=()=>{const d=new Date();return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`};
const fd=d=>d?new Date(d+"T12:00").toLocaleDateString("it-IT",{weekday:"short",day:"numeric",month:"long",year:"numeric"}):"";
const sd=d=>d?new Date(d+"T12:00").toLocaleDateString("it-IT",{day:"numeric",month:"short"}):"";
const opts=(l,c)=>l.map(o=>`<option ${o==c?"selected":""}>${E(o)}</option>`).join("");
const TIPI=["Altro","Cena di Natale","Cena di Pasqua","Data zero","Festival","Locale","Matrimonio","Privato","Sagra"];
const TABS=[["home","Home"],["date","Date"],["set","Scaletta"],["rep","Brani"],["cas","Cachet"]];
const costs=g=>["mgr","sal","sa","sl"].reduce((a,k)=>a+(+g[k]||0),0),net=g=>(+g.fee||0)-costs(g);

let db,admin=false,me=null,tab="home",S={gigs:[],songs:[],users:[]},sel=null,SL=[],fl="Tutte",sheetOpen=false,pend=false,UNS=[];
const gigs=()=>S.gigs.slice().sort((a,b)=>(a.date||"").localeCompare(b.date||""));
const songs=()=>S.songs.slice().sort((a,b)=>(a.title||"").localeCompare(b.title||"","it"));
function toast(m){const t=$("#ts");t.textContent=m;t.classList.add("on");clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove("on"),2000)}
async function save(col,o,msg){try{await db.collection(col).doc(o.id).set(o);closeSheet();toast(msg||"Salvato ✓")}catch(e){alert("Non salvato: "+(e.message||e))}}
async function del(col,id,q){if(!confirm(q))return;try{await db.collection(col).doc(id).delete();closeSheet();toast("Eliminato")}catch(e){alert("Non eliminato: "+(e.message||e))}}
function openSheet(h){$("#sh").innerHTML=`<button class="g s" style="float:right;margin:0" onclick="closeSheet()" aria-label="Chiudi">✕ Chiudi</button>`+h;sheetOpen=true;document.body.classList.add("open")}
function closeSheet(){sheetOpen=false;document.body.classList.remove("open");if(pend)render()}

/* ---------- HOME ---------- */
function vHome(){
 const t=today(),g=gigs(),up=g.filter(x=>x.date>=t),nx=up[0];
 const days=x=>Math.round((new Date(x.date+"T12:00")-new Date(t+"T12:00"))/864e5);
 const unsigned=up.filter(x=>!x.signed).length,due=g.filter(x=>!x.paid&&(+x.fee||0)>0).reduce((a,x)=>a+net(x),0);
 let h=`<div class="hd"><img src="${LOGO}" alt=""><div><div class="bn">Aironi Bianchi</div><span class="mu">Cover band Nomadi</span></div></div>`;
 h+=nx?`<div class="hero"><span class="mu">Prossima data</span><div class="bn">${E(nx.place)}</div><div>${fd(nx.date)} · <b class="wn">${days(nx)==0?"oggi":days(nx)==1?"domani":"tra "+days(nx)+" giorni"}</b></div><div class="mu">${[nx.sound&&"Soundcheck "+E(nx.sound),nx.start&&"Inizio "+E(nx.start)].filter(Boolean).join(" · ")}</div><span class="tag ${nx.status=="Confermata"?"ok":"wn"}">${E(nx.status)}</span><span class="tag ${nx.signed?"ok":"wn"}">${nx.signed?"Contratto firmato":"Contratto da firmare"}</span></div>`
   :`<div class="hero"><span class="mu">Nessuna data in programma</span></div>`;
 h+=`<div class="tiles"><div class="tile" onclick="go('date')"><div class="n">${up.length}</div><span class="mu">date in arrivo</span></div><div class="tile" onclick="go('date')"><div class="n ${unsigned?"wn":""}">${unsigned}</div><span class="mu">contratti da firmare</span></div><div class="tile" onclick="go('cas')"><div class="n ${due?"wn":""}" style="font-size:17px;line-height:33px">${eur(due).replace(",00","")}</div><span class="mu">da incassare</span></div></div>`;
 if(up.length>1)h+=`<div class="card"><b>Prossime date</b>${up.slice(1,5).map(x=>`<div class="rw"><span>${E(x.place)}</span><span class="mu">${sd(x.date)}</span></div>`).join("")}</div>`;
 h+=admin?`<button class="g" onclick="usersSheet()">Gestisci utenti</button>`:"";
 h+=`<button class="g" onclick="pwdSheet()">Cambia password</button><button class="g" onclick="firebase.auth().signOut()">Esci</button><p class="mu">Accesso come <b>${E(me?.name||"")}</b>${admin?" (amministratore)":""}</p>`;
 return h;
}

/* ---------- DATE ---------- */
function vDate(){
 const g=gigs().filter(x=>fl=="Tutte"||(fl=="Da firmare"?!x.signed:x.status==fl));
 let h=`<div class="seg">${["Tutte","Confermata","Da confermare","Da firmare"].map(o=>`<button class="${o==fl?"on":""}" onclick="fl='${o}';render()">${o}</button>`).join("")}</div>`;
 if(!g.length)h+=`<p class="mu">Nessuna data.</p>`;
 return h+g.map(x=>`<div class="card"><b>${E(x.place)}</b><span class="mu">${fd(x.date)}${x.address?" · "+E(x.address):""}</span><br>
 <span class="mu">Soundcheck ${E(x.sound||"–")} · Inizio ${E(x.start||"–")}</span><br>
 <span class="tag">${E(x.type)}</span><span class="tag ${x.status=="Confermata"?"ok":"wn"}">${E(x.status)}</span><span class="tag ${x.signed?"ok":"wn"}">${x.signed?"Contratto firmato":"Contratto da firmare"}</span>
 ${x.contract?`<div style="margin-top:8px"><a href="${E(x.contract)}" target="_blank" rel="noopener">📄 Apri il contratto</a></div>`:""}
 ${x.notes?`<div class="mu" style="margin-top:6px">${E(x.notes)}</div>`:""}
 ${admin?`<div><button class="g s" onclick="gigSheet('${x.id}')">Modifica</button></div>`:""}</div>`).join("");
}
function gigSheet(id){
 const x=S.gigs.find(g=>g.id==id)||{status:"Da confermare",type:"Locale"};
 openSheet(`<h2>${id?"Modifica data":"Nuova data"}</h2>
 <label>Luogo<input id="p" value="${E(x.place)}"></label><label>Indirizzo<input id="a" value="${E(x.address)}"></label>
 <label>Data<input id="d" type="date" value="${E(x.date)}"></label>
 <div class="row"><label>Soundcheck<input id="s" type="time" value="${E(x.sound)}"></label><label>Inizio<input id="t" type="time" value="${E(x.start)}"></label></div>
 <div class="row"><label>Tipo di serata<select id="ty">${opts(TIPI,x.type)}</select></label><label>Stato<select id="st">${opts(["Da confermare","Confermata"],x.status)}</select></label></div>
 <label class="ck"><input id="sg" type="checkbox" ${x.signed?"checked":""}> Contratto firmato</label>
 <label>Link al contratto (Google Drive)<input id="cu" type="url" placeholder="https://drive.google.com/…" value="${E(x.contract)}"></label>
 <label>Note<textarea id="n" rows="2">${E(x.notes)}</textarea></label>
 <button onclick="saveGig('${id||""}')">Salva</button>${id?`<button class="g" onclick="del('gigs','${id}','Eliminare questa data?')">Elimina</button>`:""}`);
}
function saveGig(id){
 const old=S.gigs.find(g=>g.id==id)||{};
 const o={...old,id:id||uid(),place:v("p"),address:v("a"),date:v("d"),sound:v("s"),start:v("t"),type:v("ty"),status:v("st"),signed:$("#sg").checked,contract:v("cu"),notes:v("n")};
 if(!o.place||!o.date)return alert("Servono almeno luogo e data.");
 if(o.contract&&!/^https:\/\//.test(o.contract))return alert("Il link al contratto deve iniziare con https://");
 save("gigs",o);
}

/* ---------- BRANI ---------- */
function vRep(){
 const s=songs();
 return `<p class="mu">${s.length} brani</p>`+s.map(x=>`<div class="card"><b>${E(x.title)}</b>${x.notes?`<span class="mu">${E(x.notes)}</span>`:""}${admin?`<div><button class="g s" onclick="songSheet('${x.id}')">Modifica</button></div>`:""}</div>`).join("");
}
function songSheet(id){
 const x=S.songs.find(s=>s.id==id)||{};
 openSheet(`<h2>${id?"Modifica brano":"Nuovo brano"}</h2><label>Titolo<input id="ti" value="${E(x.title)}"></label><label>Note (intro, arrangiamento…)<input id="no" value="${E(x.notes)}"></label>
 <button onclick="saveSong('${id||""}')">Salva</button>${id?`<button class="g" onclick="del('songs','${id}','Eliminare questo brano?')">Elimina</button>`:""}`);
}
function saveSong(id){const o={id:id||uid(),title:v("ti"),notes:v("no")};if(!o.title)return alert("Serve un titolo.");save("songs",o)}

/* ---------- SCALETTA ---------- */
function vSet(){
 const g=S.gigs.find(x=>x.id==sel);
 let h=`<label>Data<select onchange="pick(this.value)"><option value="">Scegli una data…</option>${gigs().map(x=>`<option value="${x.id}" ${x.id==sel?"selected":""}>${E(x.place)} · ${sd(x.date)}</option>`).join("")}</select></label>`;
 if(!g)return h+`<p class="mu">Scegli una data per vedere o preparare la scaletta.</p>`;
 const m=Object.fromEntries(S.songs.map(s=>[s.id,s.title]));let n=0;
 h+=`<div class="card"><b>Scaletta · ${E(g.place)}</b>${SL.length?"":`<p class="mu">Ancora vuota.</p>`}<ul class="sl">${SL.map((i,k)=>{const lab=i=="|"?`<i class="mu">— pausa / nuovo set —</i>`:`${++n}. ${E(m[i]||"(brano eliminato)")}`;if(i=="|")n=0;return`<li><span>${lab}</span>${admin?`<span><button class="g s" onclick="mv(${k},-1)">↑</button><button class="g s" onclick="mv(${k},1)">↓</button><button class="g s" onclick="SL.splice(${k},1);render()">✕</button></span>`:""}</li>`}).join("")}</ul>
 <div class="row"><select id="fmt"><option value="a4">A4 verticale</option><option value="a3">A3 verticale</option></select><button onclick="pdf()">Crea PDF</button></div>${admin?`<button class="g" onclick="saveSet()">Salva scaletta</button>`:""}</div>`;
 if(admin)h+=`<div class="card"><b>Aggiungi</b><button class="g s" onclick="SL.push('|');render()">+ Pausa / nuovo set</button>${songs().filter(s=>!SL.includes(s.id)).map(s=>`<button class="g s" onclick="SL.push('${s.id}');render()">+ ${E(s.title)}</button>`).join("")||`<p class="mu">Aggiungi i brani nella sezione Brani.</p>`}</div>`;
 return h;
}
function pick(id){sel=id||null;SL=((S.gigs.find(x=>x.id==sel)||{}).setlist||[]).slice();render()}
function mv(k,d){const j=k+d;if(j<0||j>=SL.length)return;[SL[k],SL[j]]=[SL[j],SL[k]];render()}
function saveSet(){const g=S.gigs.find(x=>x.id==sel);if(g)save("gigs",{...g,setlist:SL},"Scaletta salvata ✓")}
async function pdf(){
 if(!window.jspdf)return alert("Serve la connessione per creare il PDF.");
 const g=S.gigs.find(x=>x.id==sel),m=Object.fromEntries(S.songs.map(s=>[s.id,s.title])),f=$("#fmt").value,L=[];let set=1,n=0;
 if(SL.includes("|"))L.push({h:"SET 1"});
 SL.forEach(i=>{if(i=="|"){set++;n=0;L.push({h:"SET "+set})}else if(m[i])L.push({t:`${++n}. ${m[i]}`})});
 if(!L.some(x=>x.t))return alert("La scaletta è vuota.");
 const d=new jspdf.jsPDF({orientation:"portrait",unit:"mm",format:f}),w=d.internal.pageSize.getWidth(),H=d.internal.pageSize.getHeight(),k=f=="a3"?1.414:1;
 d.setFillColor(11,11,11);d.rect(0,0,w,38*k,"F");d.addImage(LOGO,"JPEG",(w-32*k)/2,3*k,32*k,32*k);
 d.setFont("helvetica","bold");d.setFontSize(30*k);d.text(g.place,w/2,54*k,{align:"center",maxWidth:w-30*k});
 d.setFont("helvetica","normal");d.setFontSize(16*k);d.text(fd(g.date),w/2,64*k,{align:"center"});
 const top=78*k,lh=Math.min(15*k,(H-top-10*k)/L.length),fs=Math.min(28*k,lh/0.5);
 L.forEach((x,j)=>{const y=top+j*lh;if(x.h){d.setFont("helvetica","normal");d.setFontSize(fs*.6);d.setTextColor(180,20,20);d.text(x.h,18*k,y);d.setTextColor(0,0,0)}else{d.setFont("helvetica","bold");d.setFontSize(fs);d.text(x.t,18*k,y,{maxWidth:w-36*k})}});
 const name=`Scaletta ${g.place} ${g.date}.pdf`.replace(/[\\/:*?"<>|]/g,""),bl=d.output("blob");
 try{const fi=new File([bl],name,{type:"application/pdf"});if(navigator.canShare&&navigator.canShare({files:[fi]})){await navigator.share({files:[fi],title:name});return}}catch(e){if(e.name=="AbortError")return}
 const a=document.createElement("a");a.href=URL.createObjectURL(bl);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},3000);toast("PDF scaricato");
}

/* ---------- CACHET ---------- */
function vCas(){
 const g=gigs(),tot=g.reduce((a,x)=>a+net(x),0),inc=g.filter(x=>x.paid).reduce((a,x)=>a+net(x),0);
 let h=`<div class="card"><b>Totale netto ${eur(tot)}</b><span class="ok">Incassato ${eur(inc)}</span> · <span class="wn">Da incassare ${eur(tot-inc)}</span></div>`;
 if(!g.length)return h+`<p class="mu">Aggiungi prima una data.</p>`;
 return h+g.map(x=>`<div class="card"><b>${E(x.place)}</b><span class="mu">${sd(x.date)}</span>
 <div class="rw"><span>Lordo</span><span>${eur(x.fee)}</span></div><div class="rw"><span>Costi</span><span>${eur(costs(x))}</span></div>
 <div class="rw"><b>Netto · a testa (${MEMBRI})</b><b>${eur(net(x))} · ${eur(net(x)/MEMBRI)}</b></div>
 <span class="tag ${x.paid?"ok":"wn"}">${x.paid?"Pagato":"Da incassare"}</span>${admin?`<div><button class="g s" onclick="casSheet('${x.id}')">Modifica cachet</button></div>`:""}</div>`).join("");
}
function casSheet(id){
 const x=S.gigs.find(g=>g.id==id),num=(i,l,k)=>`<label>${l} (€)<input id="${i}" type="text" inputmode="decimal" placeholder="0" value="${E(x[k]??"")}"></label>`;
 openSheet(`<h2>Cachet · ${E(x.place)}</h2>${num("f1","Cachet lordo","fee")}${num("f2","Manager","mgr")}${num("f3","Service audio e luci","sal")}${num("f4","Service audio","sa")}${num("f5","Service luci","sl")}
 <label class="ck"><input id="f6" type="checkbox" ${x.paid?"checked":""}> Pagamento ricevuto</label><button onclick="saveCas('${id}')">Salva</button>`);
}
function saveCas(id){const x=S.gigs.find(g=>g.id==id),n=i=>+v(i).replace(",",".")||0;save("gigs",{...x,fee:n("f1"),mgr:n("f2"),sal:n("f3"),sa:n("f4"),sl:n("f5"),paid:$("#f6").checked})}

/* ---------- UTENTI ---------- */
const mail=u=>u.toLowerCase()+"@"+DOM;
function usersSheet(){
 openSheet(`<h2>Utenti</h2><p class="mu">Gli utenti vedono tutto ma non possono modificare. Solo tu modifichi.</p>
 ${S.users.slice().sort((a,b)=>a.username.localeCompare(b.username)).map(u=>`<div class="rw"><span>${E(u.username)}</span><button class="g s" onclick="delUser('${u.id}','${E(u.username)}')">Togli accesso</button></div>`).join("")||`<p class="mu">Nessun utente.</p>`}
 <h2 style="margin-top:16px">Nuovo utente</h2><label>Nome utente<input id="nu" autocapitalize="none" autocomplete="off" placeholder="es. marco"></label><label>Password (almeno 6 caratteri)<input id="np" type="text" autocomplete="off"></label>
 <div class="err" id="ue"></div><button onclick="addUser()">Crea utente</button>`);
}
async function addUser(){
 const u=v("nu").toLowerCase(),p=v("np"),err=m=>$("#ue").textContent=m;
 if(!/^[a-z0-9._-]{3,20}$/.test(u))return err("Nome utente: 3-20 caratteri, solo lettere, numeri, punto, trattino.");
 if(u==ADMIN_USER.toLowerCase())return err("Questo nome è dell'amministratore.");
 if(p.length<6)return err("La password deve avere almeno 6 caratteri.");
 try{
  const sec=firebase.apps.find(a=>a.name=="sec")||firebase.initializeApp(firebaseConfig,"sec");
  await sec.auth().setPersistence(firebase.auth.Auth.Persistence.NONE);
  const c=await sec.auth().createUserWithEmailAndPassword(mail(u),p);
  await db.collection("users").doc(c.user.uid).set({id:c.user.uid,username:u});
  await sec.auth().signOut();
  toast("Utente creato ✓");usersSheet();
 }catch(e){err(e.code=="auth/email-already-in-use"?"Questo nome utente è già stato usato: scegline un altro.":"Errore: "+(e.message||e))}
}
async function delUser(id,name){if(!confirm(`Togliere l'accesso a ${name}?`))return;try{await db.collection("users").doc(id).delete();toast("Accesso tolto");usersSheet()}catch(e){alert(e.message||e)}}
function pwdSheet(){openSheet(`<h2>Cambia password</h2><label>Nuova password (almeno 6 caratteri)<input id="p1" type="password"></label><label>Ripeti<input id="p2" type="password"></label><div class="err" id="pe"></div><button onclick="chPwd()">Salva</button>`)}
async function chPwd(){
 const a=v("p1"),b=v("p2"),err=m=>$("#pe").textContent=m;
 if(a.length<6)return err("Almeno 6 caratteri.");if(a!=b)return err("Le due password non coincidono.");
 try{await firebase.auth().currentUser.updatePassword(a);closeSheet();toast("Password cambiata ✓")}
 catch(e){err(e.code=="auth/requires-recent-login"?"Per sicurezza esci, rientra e riprova subito.":"Errore: "+(e.message||e))}
}

/* ---------- NAVIGAZIONE ---------- */
function go(t){tab=t;render();scrollTo(0,0)}
function add(){({date:()=>gigSheet(),rep:()=>songSheet()})[tab]?.()}
function render(){
 if(sheetOpen){pend=true;return}pend=false;
 $("#nav").innerHTML=TABS.map(([k,n])=>`<button class="${k==tab?"on":""}" onclick="go('${k}')">${n}</button>`).join("");
 $("#fab").style.display=admin&&(tab=="date"||tab=="rep")?"block":"none";
 const f={home:vHome,date:vDate,set:vSet,rep:vRep,cas:vCas}[tab];
 $("#app").innerHTML=(tab=="home"?"":`<h1>${TABS.find(t=>t[0]==tab)[1]}</h1>`)+f()+(admin||tab=="home"?"":`<p class="mu">Sola lettura</p>`);
}

/* ---------- ACCESSO ---------- */
function loginScreen(msg){
 UNS.forEach(f=>f());UNS=[];$("#nav").innerHTML="";$("#fab").style.display="none";closeSheet();
 $("#app").innerHTML=`<div class="login"><img src="${LOGO}" alt="Aironi Bianchi"><label>Nome utente<input id="lu" autocapitalize="none" autocomplete="username"></label><label>Password<input id="lp" type="password" autocomplete="current-password" onkeydown="if(event.key=='Enter')login()"></label><div class="err" id="le">${E(msg||"")}</div><button onclick="login()" style="width:100%">Entra</button>
 <p class="mu" style="margin-top:28px">Primo avvio? <a href="#" onclick="firstAdmin();return false">Crea l'account amministratore</a></p></div>`;
}
async function login(){
 const u=v("lu").toLowerCase(),p=$("#lp").value;if(!u||!p)return $("#le").textContent="Inserisci nome utente e password.";
 $("#le").textContent="Accesso…";
 try{await firebase.auth().signInWithEmailAndPassword(mail(u),p)}
 catch(e){$("#le").textContent=e.code=="auth/too-many-requests"?"Troppi tentativi: riprova tra qualche minuto.":e.code=="auth/network-request-failed"?"Nessuna connessione.":"Nome utente o password errati."}
}
async function firstAdmin(){
 const u=v("lu").toLowerCase(),p=$("#lp").value,err=m=>$("#le").textContent=m;
 if(u!=ADMIN_USER.toLowerCase())return err(`Scrivi «${ADMIN_USER}» come nome utente e scegli una password, poi tocca di nuovo il link.`);
 if(p.length<6)return err("Scegli una password di almeno 6 caratteri.");
 try{await firebase.auth().createUserWithEmailAndPassword(mail(u),p)}
 catch(e){err(e.code=="auth/email-already-in-use"?"L'account amministratore esiste già: usa Entra.":"Errore: "+(e.message||e))}
}
function listen(){
 UNS.forEach(f=>f());UNS=[];
 ["gigs","songs","users"].forEach(k=>UNS.push(db.collection(k).onSnapshot(s=>{S[k]=s.docs.map(d=>({...d.data(),id:d.id}));render()},e=>{if(e.code=="permission-denied")loginScreen("Il tuo accesso è stato tolto o non è attivo. Chiedi all'amministratore.");})));
}
(()=>{
 if(typeof firebase=="undefined")return $("#app").innerHTML=`<div class="login"><img src="${LOGO}" alt=""><p>Serve la connessione a internet.</p><button onclick="location.reload()">Riprova</button></div>`;
 firebase.initializeApp(firebaseConfig);db=firebase.firestore();
 try{db.settings({ignoreUndefinedProperties:true})}catch(e){}
 db.enablePersistence({synchronizeTabs:true}).catch(()=>{});
 firebase.auth().onAuthStateChanged(async u=>{
  if(!u){me=null;admin=false;return loginScreen()}
  const name=(u.email||"").split("@")[0];admin=name==ADMIN_USER.toLowerCase();me={uid:u.uid,name};
  if(!admin){try{const d=await db.collection("users").doc(u.uid).get();if(!d.exists)throw 0}catch(e){await firebase.auth().signOut();return loginScreen("Il tuo accesso è stato tolto. Chiedi all'amministratore.")}}
  listen();render();
 });
})();
</script>
</body>
